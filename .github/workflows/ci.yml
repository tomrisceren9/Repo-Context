name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra benchmark --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy .
      - name: Test
        run: uv run coverage run -m pytest -q
      - name: Coverage gate
        run: uv run coverage report --fail-under=80
      - name: Compile
        run: uv run python -m compileall -q -x '/\.venv/' .
      - name: Build distributions
        run: uv build

  windows-paths:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra benchmark --extra dev
      - name: Windows path behavior
        run: uv run pytest tests/test_windows_paths.py -q
      - name: Installed CLI outside package directory
        shell: pwsh
        run: |
          $outside = Join-Path $env:RUNNER_TEMP "air-context-outside"
          New-Item -ItemType Directory -Force -Path $outside | Out-Null
          Push-Location $outside
          & "$env:GITHUB_WORKSPACE\.venv\Scripts\air-context.exe" --help
          Pop-Location
