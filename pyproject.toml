[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "air-context-engine"
version = "0.7.0"
description = "Local-first repository context generation, code search, and LLM benchmarks"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "air-context-engine contributors" }]
keywords = ["code-search", "context-engineering", "local-llm", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "click>=8.1.0,<9",
    "filelock>=3.15,<5",
    "jsonschema>=4.22,<5",
    "pathspec>=0.11.0,<2",
    "rich>=13.0.0,<16",
    "tree-sitter>=0.21.0,<0.27",
    "tree-sitter-c>=0.21.0,<0.25",
    "tree-sitter-cpp>=0.21.0,<0.24",
    "tree-sitter-c-sharp>=0.23.0,<0.24",
    "tree-sitter-go>=0.23.0,<0.26",
    "tree-sitter-java>=0.23.0,<0.24",
    "tree-sitter-javascript>=0.23.0,<0.26",
    "tree-sitter-python>=0.21.0,<0.26",
    "tree-sitter-rust>=0.23.0,<0.25",
    "tree-sitter-typescript>=0.23.0,<0.24",
    "tomli>=2.0,<3; python_version < '3.11'",
]

[project.optional-dependencies]
benchmark = [
    "httpx>=0.27.0,<1",
    "python-dotenv>=1.0.0,<2",
]
semantic = [
    "sentence-transformers>=3.0,<6",
]
dev = [
    "coverage>=7.6,<8",
    "mypy>=1.15,<2",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
    "types-setuptools>=75,<82",
]

[project.scripts]
air-context = "air_context_engine.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["air_context_engine*"]

[tool.setuptools.package-data]
"air_context_engine.benchmarks" = ["benchmark_questions.schema.json"]

[tool.ruff]
target-version = "py310"
exclude = [".venv", "tests/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
ignore_missing_imports = true
exclude = ["^(tests|build|dist)/"]

[tool.coverage.run]
branch = true
source = ["src/air_context_engine"]
omit = [
    ".venv/*",
    "tests/*",
    "src/air_context_engine/benchmarks/benchmark_llm.py",
    "src/air_context_engine/benchmarks/benchmark_static.py",
    "src/air_context_engine/benchmarks/report_generator.py",
    "src/air_context_engine/cli.py",
    "src/air_context_engine/cli_errors.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
